name: Crawl A-share bank shareholders by year 2010-2023

on:
  push:
    paths:
      - '.github/workflows/crawl-shareholders-matrix.yml'
      - 'crawl_shareholders.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  shareholders:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Crawl year
        run: python crawl_shareholders.py --start-year ${{ matrix.year }} --end-year ${{ matrix.year }} --output results_shareholders/${{ matrix.year }}

      - name: Show summary
        if: always()
        run: cat results_shareholders/${{ matrix.year }}/00_运行摘要.json || true

      - name: Upload year result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-shareholders-${{ matrix.year }}
          path: results_shareholders/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
