name: Reparse executive bank histories V2 high precision 2010-2023

on:
  push:
    branches: [main]
    paths:
      - 'reparse_executive_bank_history_v2.py'
      - '.github/workflows/reparse-executive-bank-history-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  reparse-v2:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install requests akshare==1.18.64

      - name: Syntax check
        run: python -m py_compile reparse_executive_bank_history_v2.py crawl_executive_bank_history.py crawl_executives.py

      - name: Download repaired artifact
        uses: actions/download-artifact@v4
        with:
          name: executive-bank-history-repaired-${{ matrix.year }}
          path: repaired/${{ matrix.year }}
          github-token: ${{ github.token }}
          run-id: 31507316331
          repository: liu-zhengquan/-

      - name: Reparse annual reports with V2 high-precision rules
        run: |
          python reparse_executive_bank_history_v2.py \
            --year ${{ matrix.year }} \
            --input-dir repaired/${{ matrix.year }} \
            --output results_executive_bank_history_v2/${{ matrix.year }} \
            --pdf-workers 3

      - name: Show V2 summary
        if: always()
        run: |
          find results_executive_bank_history_v2/${{ matrix.year }} -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          cat results_executive_bank_history_v2/${{ matrix.year }}/00_运行摘要_V2.json || true

      - name: Upload V2 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executive-bank-history-v2-${{ matrix.year }}
          path: results_executive_bank_history_v2/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
