name: Crawl non-ST non-financial A-share executive bank histories 2010-2023

on:
  push:
    branches: [main]
    paths:
      - 'crawl_executive_bank_history.py'
      - '.github/workflows/crawl-executive-bank-history.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  executive-bank-history:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install requests akshare==1.18.64

      - name: Syntax check
        run: python -m py_compile crawl_executive_bank_history.py crawl_shareholders.py crawl_executives.py

      - name: Crawl filtered A-share executives and bank employment histories
        run: |
          python crawl_executive_bank_history.py \
            --year ${{ matrix.year }} \
            --output results_executive_bank_history/${{ matrix.year }} \
            --industry-workers 4

      - name: Show summary
        if: always()
        run: |
          find results_executive_bank_history/${{ matrix.year }} -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          cat results_executive_bank_history/${{ matrix.year }}/00_运行摘要.json || true

      - name: Upload year result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executive-bank-history-nonst-nonfinancial-${{ matrix.year }}
          path: results_executive_bank_history/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
