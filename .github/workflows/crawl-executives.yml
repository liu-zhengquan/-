name: Crawl executive bank backgrounds 2010-2023

on:
  push:
    paths:
      - 'crawl_executives.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  executives:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pip install requests

      - name: Crawl annual reports and identify bank-background executives
        run: python crawl_executives.py --year ${{ matrix.year }} --output results_executives/${{ matrix.year }}

      - name: Show summary
        if: always()
        run: |
          find results_executives/${{ matrix.year }} -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          cat results_executives/${{ matrix.year }}/00_运行摘要.json || true

      - name: Upload year result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executive-bank-background-${{ matrix.year }}
          path: results_executives/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
