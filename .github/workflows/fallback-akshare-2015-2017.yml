name: AKShare fallback missing annual reports 2015-2017

on:
  push:
    branches: [main]
    paths:
      - 'fallback_missing_reports_akshare.py'
      - '.github/workflows/fallback-akshare-2015-2017.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fallback-akshare:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2015, 2016, 2017]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pip install requests akshare==1.18.64
      - name: Download prior final artifact
        uses: actions/download-artifact@v4
        with:
          name: executive-bank-history-final-${{ matrix.year }}
          path: prior/${{ matrix.year }}
          github-token: ${{ github.token }}
          run-id: 31523765443
      - name: AKShare disclosure fallback
        run: |
          python fallback_missing_reports_akshare.py \
            --year ${{ matrix.year }} \
            --input-dir prior/${{ matrix.year }} \
            --output results_akshare_fallback/${{ matrix.year }}
      - name: Show summary
        if: always()
        run: cat results_akshare_fallback/${{ matrix.year }}/00_运行摘要_最终补查.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executive-bank-history-akshare-final-${{ matrix.year }}
          path: results_akshare_fallback/${{ matrix.year }}/
          if-no-files-found: warn
          retention-days: 30
